<html>

<body>
    <h1>Funciones en JavaScript</h1>

    <script>
        function sumar(a, b) {
            return a + b;
        }

        function restar(a, b) {
            return a - b;
        }

        function multiplicar(a, b) {
            return a * b
        }

        function dividir(a, b) {
            return a / b
        }

        function inicio(operacion) {
            const resultado = operacion
            document.writeln(`El resultado es ${resultado}`);
        }
    </script>

    <input type="button" value="Sumar" onclick="inicio(sumar(2, 3))" />
    <input type="button" value="Restar" onclick="inicio(restar(5, 2))" />
    <input type="button" value="Multiplicar" onclick="inicio(multiplicar(2, 8))" />
    <input type="button" value="dividir" onclick="inicio(dividir(5, 6))" />

</body>

</html>
